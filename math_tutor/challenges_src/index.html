<script>
const LEGACY_SESSION_KEY = 'math_tutor_challenge_session';
const SESSION_KEY_PREFIX = 'math_tutor_challenge_session:';
let selectedBank = 'classic';

function readStoredSession(key) {
  try {
    var saved = JSON.parse(localStorage.getItem(key) || 'null');
    if (!saved || !saved.exam_id) return null;
    saved.__storageKey = key;
    return saved;
  } catch (e) {
    return null;
  }
}

function sessionSavedAtMs(saved) {
  var value = Date.parse(saved && saved.savedAt ? saved.savedAt : '');
  return isNaN(value) ? 0 : value;
}

function getAllLocalSessions() {
  var byExam = {};
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (!key || key.indexOf(SESSION_KEY_PREFIX) !== 0) continue;
    var saved = readStoredSession(key);
    if (!saved) continue;
    var existing = byExam[saved.exam_id];
    if (!existing || sessionSavedAtMs(saved) >= sessionSavedAtMs(existing)) {
      byExam[saved.exam_id] = saved;
    }
  }

  var legacySaved = readStoredSession(LEGACY_SESSION_KEY);
  if (legacySaved) {
    var current = byExam[legacySaved.exam_id];
    if (!current || sessionSavedAtMs(legacySaved) > sessionSavedAtMs(current)) {
      byExam[legacySaved.exam_id] = legacySaved;
    }
  }

  return Object.values(byExam).sort(function(a, b) {
    return sessionSavedAtMs(b) - sessionSavedAtMs(a);
  });
}

function discardStoredSession(storageKey) {
  if (!storageKey) return;
  localStorage.removeItem(storageKey);
}

function questionCountForSavedSession(saved, examIndexById) {
  if (saved && saved.questionCount) return saved.questionCount;
  var exam = examIndexById && examIndexById[saved.exam_id];
  if (!exam) return 0;
  if (typeof exam.question_count === 'number' && exam.question_count > 0) return exam.question_count;
  return (exam.mm || 0) + (exam.op || 0);
}

function examBankId(exam) {
  return (exam && (exam.bank || exam.bank_id)) || 'classic';
}

function examBankTitle(exam) {
  var bankId = examBankId(exam);
  if (bankId === 'classic') return 'AI-Generated';
  return (exam && (exam.bank_title || exam.bank_label)) || 'AI-Generated';
}

function buildBankEntries(allExams) {
  var byBank = {};
  var entries = [];
  allExams.forEach(function(exam) {
    var bankId = examBankId(exam);
    if (!byBank[bankId]) {
      byBank[bankId] = { id: bankId, title: examBankTitle(exam), count: 0 };
      entries.push(byBank[bankId]);
    }
    byBank[bankId].count += 1;
  });
  entries.sort(function(a, b) {
    if (a.id === 'classic') return -1;
    if (b.id === 'classic') return 1;
    return a.title.localeCompare(b.title);
  });
  return entries;
}

function renderResumeCards(completedSet, examIndexById) {
  var container = document.getElementById('resume-container');
  var sessions = getAllLocalSessions().filter(function(saved) {
    if (completedSet && completedSet.has(saved.exam_id)) {
      discardStoredSession(saved.__storageKey);
      return false;
    }
    return true;
  });

  if (!sessions.length) {
    container.innerHTML = '';
    return;
  }

  container.innerHTML = sessions.map(function(saved) {
    var answered = Object.values(saved.answers || {}).filter(function(v) {
      return (v || '').trim();
    }).length;
    var total = questionCountForSavedSession(saved, examIndexById);
    var m = Math.floor((saved.timerSecs || 0) / 60), s = (saved.timerSecs || 0) % 60;
    var timeStr = m + ':' + (s < 10 ? '0' : '') + s;
    var questionNumber = total > 0 ? Math.min((saved.idx || 0) + 1, total) : ((saved.idx || 0) + 1);
    var questionStr = total > 0
      ? ('Question ' + questionNumber + ' of ' + total)
      : ('Question ' + questionNumber);
    var answeredStr = total > 0
      ? (answered + '/' + total + ' answered')
      : (answered + ' answered');
    return `
      <div class="resume-card">
        <div class="resume-label">&#9654; Resume challenge in progress</div>
        <p class="resume-title">${saved.exam_title || 'Challenge Exam'}</p>
        <div class="resume-meta">${questionStr} &middot; ${answeredStr} &middot; ${timeStr} elapsed</div>
        <div class="resume-actions">
          <a class="resume-btn" href="exam.html?id=${encodeURIComponent(saved.exam_id)}">Continue Challenge &rarr;</a>
          <button class="discard-link" type="button" data-discard-key="${saved.__storageKey}">Discard &amp; start fresh</button>
        </div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('[data-discard-key]').forEach(function(button) {
    button.addEventListener('click', function() {
      discardStoredSession(button.getAttribute('data-discard-key'));
      renderResumeCards(completedSet, examIndexById);
    });
  });
}

(async function () {
  const root = document.getElementById('root');

  // Fetch exam index and completed list in parallel
  let data, completedIds = [];
  try {
    const examIndexUrl = 'exams-index.json?v=' + Date.now();
    const [indexRes, completedRes] = await Promise.all([
      fetch(examIndexUrl, { cache: 'no-store' }),
      fetch('completed.php').catch(function() { return null; }),
    ]);
    data = await indexRes.json();
    if (completedRes && completedRes.ok) {
      const cdata = await completedRes.json();
      completedIds = cdata.completed || [];
    }
  } catch (e) {
    root.innerHTML = '<div class="error-box">Could not load exams. Please try again later.</div>';
    return;
  }

  const allExams = data.exams || [];
  if (!allExams.length) {
    root.innerHTML = '<div class="error-box">No exams found.</div>';
    return;
  }

  const bankEntries = buildBankEntries(allExams);
  selectedBank = bankEntries.some(function(entry) { return entry.id === 'classic'; })
    ? 'classic'
    : bankEntries[0].id;

  const completedSet = new Set(completedIds);
  const examIndexById = {};
  allExams.forEach(function(exam) {
    examIndexById[exam.id] = exam;
  });

  // Render resumable sessions now that we know which exams are already completed
  renderResumeCards(completedSet, examIndexById);

  const availableExams = allExams.filter(function(e) { return !completedSet.has(e.id); });
  const doneCount = completedSet.size;

  // Show progress chip if at least one exam is completed
  if (doneCount > 0) {
    const pct = Math.round((doneCount / allExams.length) * 100);
    const progressContainer = document.createElement('div');
    progressContainer.innerHTML = `
      <div class="progress-chip">
        &#127942; ${doneCount} / ${allExams.length} completed
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width:${pct}%"></div>
        </div>
      </div>
    `;
    document.getElementById('resume-container').before(progressContainer.firstElementChild);
  }

  // Track recently shown exams to avoid immediate repeats
  const shownByBank = {};

  function availableExamsForSelectedBank() {
    return availableExams.filter(function(exam) {
      return examBankId(exam) === selectedBank;
    });
  }

  function updateBundleInfo() {
    if (!data.generated_at) return;
    const d = new Date(data.generated_at);
    const label = d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
    const bankTitle = (bankEntries.find(function(entry) { return entry.id === selectedBank; }) || {}).title || 'AI-Generated';
    const bankExamCount = allExams.filter(function(exam) { return examBankId(exam) === selectedBank; }).length;
    document.getElementById('bundle-info').textContent =
      `${bankTitle} bank · ${bankExamCount} exams · Bundle generated ${label}`;
  }

  function renderBankPicker() {
    const picker = document.getElementById('bank-picker');
    picker.innerHTML = bankEntries.map(function(entry) {
      return `<button class="bank-pill${entry.id === selectedBank ? ' active' : ''}" type="button" data-bank="${entry.id}">${entry.title} (${entry.count})</button>`;
    }).join('');
    picker.querySelectorAll('[data-bank]').forEach(function(button) {
      button.addEventListener('click', function() {
        selectedBank = button.getAttribute('data-bank');
        updateBundleInfo();
        renderCurrentBank();
      });
    });
  }

  function pickRandom(examsForBank) {
    const shown = shownByBank[selectedBank] || new Set();
    shownByBank[selectedBank] = shown;
    if (shown.size >= examsForBank.length) shown.clear();
    let exam;
    do { exam = examsForBank[Math.floor(Math.random() * examsForBank.length)]; }
    while (shown.has(exam.id));
    shown.add(exam.id);
    return exam;
  }

  function render(exam) {
    const mm = exam.mm;
    const op = exam.op;
    const chapters = exam.chapters || [];
    const questionCount = exam.question_count || ((mm || 0) + (op || 0));
    const chapterText = chapters.length > 5
      ? chapters.slice(0, 4).join(', ') + ` +${chapters.length - 4} more`
      : chapters.join(', ');
    const bankTitle = examBankTitle(exam);
    const countTags = [];
    if (mm > 0) countTags.push(`<span class="tag tag-mm">${mm} Mental Math</span>`);
    if (op > 0) countTags.push(`<span class="tag tag-op">${op} Olympiad</span>`);
    const chapterRow = chapterText
      ? `<div class="tag-row"><span class="tag tag-ch">Chapters: ${chapterText}</span></div>`
      : '';

    root.innerHTML = `
      <div class="challenge-card">
        <div class="card-label">Your Challenge</div>
        <p class="card-title">${exam.title}</p>
        <div class="tag-row">
          <span class="tag tag-q">${questionCount} Questions</span>
          <span class="tag tag-bank">${bankTitle}</span>
          ${countTags.join('')}
        </div>
        ${chapterRow}
        <a class="start-btn" href="exam.html?id=${encodeURIComponent(exam.id)}">Start Challenge! &rarr;</a>
      </div>
      <button class="another-link" id="another-btn">&#128256; Try a Different Challenge</button>
    `;

    document.getElementById('another-btn').addEventListener('click', function () {
      render(pickRandom(availableExamsForSelectedBank()));
    });
  }

  function renderCurrentBank() {
    renderBankPicker();
    const examsForBank = availableExamsForSelectedBank();
    if (!examsForBank.length) {
      const bankTitle = (bankEntries.find(function(entry) { return entry.id === selectedBank; }) || {}).title || 'Selected';
      root.innerHTML = `
        <div class="all-done-box">
          <h2>&#127881; ${bankTitle} Complete!</h2>
          <p>You've finished all available exams in this bank. Pick another bank or review your results below.</p>
          <a href="reports.php"><span class="auth-icon" aria-hidden="true">&#128737;&#65038;</span>View Reports &rarr;</a>
        </div>
      `;
      return;
    }
    render(pickRandom(examsForBank));
  }

  updateBundleInfo();
  renderCurrentBank();
})();
</script>
</body>
</html>
